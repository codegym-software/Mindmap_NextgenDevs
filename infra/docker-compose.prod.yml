services:
  mongo:
    image: mongo:7
    restart: always
    volumes:
      - ./mongo-data:/data/db

  api:
    build: ../api
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MONGO_URI=mongodb://mongo:27017/mindmapdb
      - COGNITO_REGION=ap-southeast-2
      - COGNITO_USER_POOL_ID=ap-southeast-2_t30OWWizg
      - COGNITO_JWK_SET_URI=https://cognito-idp.ap-southeast-2.amazonaws.com/ap-southeast-2_t30OWWizg/.well-known/jwks.json
      - COGNITO_AUDIENCE=qs4o5vsr1c01i0kgh85ted9vo
      - COGNITO_ISSUER=https://cognito-idp.ap-southeast-2.amazonaws.com/ap-southeast-2_t30OWWizg
      - RATE_LIMIT_REQUESTS_PER_MINUTE=240
    depends_on:
      - mongo

  web:
    build: ../web
    depends_on:
      - api
    ports:
      - "80:80"
    environment:
      - VITE_COGNITO_CLIENT_ID=2t1lfqfuphveqgh31nfkggg0kl
      - VITE_COGNITO_DOMAIN=ap-southeast-2t30owwizg.auth.ap-southeast-2.amazoncognito.com
      - VITE_COGNITO_REDIRECT_URI=${COGNITO_REDIRECT_URI}
      - VITE_COGNITO_LOGOUT_REDIRECT=${COGNITO_LOGOUT_REDIRECT}
      - VITE_API_BASE=/api
